---
name: Sync upstream image template

on:
  schedule:
    - cron: "15 10 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  check-conflict:
    runs-on: ubuntu-24.04
    outputs:
      blocked: ${{ steps.lookup.outputs.blocked }}
    steps:
      - name: Check for open conflict issue
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_LABEL: upstream-template-sync-conflict
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          issue_count="$(gh api --paginate \
            "repos/${REPOSITORY}/issues?state=open&labels=${CONFLICT_LABEL}&per_page=100" \
            | jq -s '[.[][] | select(.pull_request | not)] | length')"

          if [[ "${issue_count}" -gt 0 ]]; then
            echo "blocked=true" >> "${GITHUB_OUTPUT}"
            echo "An open upstream sync conflict issue already exists; skipping merge."
          else
            echo "blocked=false" >> "${GITHUB_OUTPUT}"
          fi

  sync:
    needs: check-conflict
    if: needs.check-conflict.outputs.blocked != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream template
        id: merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_REPOSITORY: https://github.com/ublue-os/image-template.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${UPSTREAM_REPOSITORY}"
          git fetch --no-tags upstream main

          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
            exit 0
          fi

          echo "conflict=true" >> "${GITHUB_OUTPUT}"
          conflict_files="$(git diff --name-only --diff-filter=U || true)"
          {
            echo "UPSTREAM_CONFLICT_FILES<<EOF"
            printf '%s\n' "${conflict_files}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

          git merge --abort || true
          exit 1

      - name: Notify about merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_FILES: ${{ env.UPSTREAM_CONFLICT_FILES }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="The weekly merge from ublue-os/image-template:main could not be completed.

          Default branch: ${DEFAULT_BRANCH}
          Workflow run: ${RUN_URL}

          Conflicting paths:
          ${CONFLICT_FILES}

          Resolve the conflict locally, then close this issue."

          gh issue create \
            --title "Upstream template sync conflict" \
            --label "upstream-template-sync-conflict" \
            --body "${body}"
